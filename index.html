<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KaizenTrim | Oto ve Motosiklet Trim Parçaları</title>
<meta name="description" content="Siparişe özel 3D baskı oto ve motosiklet iç trim parçaları. Aracını seç, parçayı görsel olarak doğrula.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#ecefef;--surface:#fff;--ink:#13202b;--muted:#5d6b77;--line:#c7d0d6;--accent:#e8590c;--accent-ink:#fff;--soft:#dfe5e8;
--f-display:'Barlow Condensed','Arial Narrow',sans-serif;--f-body:'IBM Plex Sans',system-ui,sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0e151b;--surface:#16212a;--ink:#e6edf2;--muted:#93a3b0;--line:#2a3945;--accent:#ff7a33;--accent-ink:#1a0d03;--soft:#1d2b36;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);padding:0 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin-inline:auto}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--ink);margin-inline:-16px;padding:12px 16px}
header.top .wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{font:700 28px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;background:none;border:0;padding:0;text-decoration:none}
.brand b{color:var(--accent)}
.search{flex:1 1 220px;min-width:0}
.search input{width:100%;padding:10px 12px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);font:inherit;border-radius:2px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-block:16px 8px;font:500 13px var(--f-mono);color:var(--muted)}
.crumbs a{color:var(--ink);text-underline-offset:3px}
h1{font:700 clamp(34px,7vw,60px)/1 var(--f-display);text-transform:uppercase;margin:8px 0;text-wrap:balance;overflow-wrap:anywhere}
h2{font:600 24px var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 8px}
.lead{color:var(--muted);max-width:60ch;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.grid.parts{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:2px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;text-decoration:none;transition:border-color .12s,transform .12s}
.tile:hover{border-color:var(--ink);transform:translateY(-2px)}
.mono{font:500 13px var(--f-mono);color:var(--muted)}
.mark{width:56px;height:56px;border:2px solid var(--ink);display:grid;place-items:center;font:700 26px var(--f-display);background:var(--soft)}
.tile .name{font:600 21px/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.03em;overflow-wrap:anywhere}
.tile.pt{padding:10px}
.tile.pt img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;border:1px solid var(--line)}
.tile.pt .name{font-size:18px;text-transform:none;letter-spacing:0;font-weight:600}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.cat{background:var(--surface);border:2px solid var(--ink);padding:28px 24px;display:flex;flex-direction:column;gap:12px;min-height:260px;justify-content:flex-end;text-decoration:none}
a.cat:hover{background:var(--ink);color:var(--bg)}a.cat:hover .mono{color:var(--bg)}
.cat.off{opacity:.55;border-style:dashed}
.cat .big{font:700 clamp(44px,9vw,76px)/.95 var(--f-display);text-transform:uppercase}
.chip{display:inline-block;font:500 12px var(--f-mono);border:1.5px solid var(--ink);padding:1px 8px;border-radius:2px;width:max-content}
.note{border-left:4px solid var(--accent);background:var(--surface);padding:12px 16px;margin-block:16px;max-width:70ch}
.detail{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:32px;margin-top:16px}
@media (max-width:760px){.detail{grid-template-columns:minmax(0,1fr)}}
.stage{background:#fff;border:2px solid var(--ink);padding:8px}
.stage img{width:100%;aspect-ratio:4/3;object-fit:contain;display:block}
.thumbs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.thumbs button{width:76px;height:60px;padding:2px;border:1.5px solid var(--line);background:#fff}
.thumbs button[aria-pressed="true"]{border-color:var(--ink);outline:2px solid var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:contain}
.check{background:var(--surface);border:1.5px solid var(--line);padding:12px 16px;margin-block:12px}
.check ul{margin:6px 0 0;padding-left:20px}
.cols{display:flex;flex-wrap:wrap;gap:6px;margin-block:8px 16px}
.cols span{font:500 12px var(--f-mono);border:1.5px solid var(--line);padding:2px 8px;border-radius:12px;background:var(--surface)}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-block:16px}
.btn{display:inline-block;text-decoration:none;text-align:center;padding:12px 20px;font:600 20px var(--f-display);letter-spacing:.05em;text-transform:uppercase;border:2px solid var(--ink);border-radius:2px;background:var(--surface);cursor:pointer}
.btn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fine{font-size:13px;color:var(--muted);max-width:60ch}
.empty{border:2px dashed var(--line);padding:32px;text-align:center;color:var(--muted)}
.more{display:block;margin:24px auto 0}
footer{margin-top:56px;padding-top:16px;border-top:2px solid var(--ink);font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#/">Kaizen<b>Trim</b></a>
  <div class="search"><input id="q" type="search" placeholder="Parça ara: MT 07, zincir koruma, Yamaha..." aria-label="Ara"></div>
</div></header>
<main class="wrap">
  <nav class="crumbs" id="crumbs" aria-label="Konum"></nav>
  <div id="view"><p class="lead">Katalog yükleniyor...</p></div>
  <footer>KaizenTrim · Siparişe özel 3D baskı trim parçaları · Ücretsiz kargo</footer>
</main>
<script>
const SHOPIER="https://www.shopier.com/KaizenTrim", IG="https://ig.me/m/kaizentrim";
const COLORS=["Siyah","Beyaz","Gri","Gümüş Gri","Antrasit Gri","Kahverengi","Koyu Kahverengi","Açık Yeşil","Yeşil","Mor","Sarı","Mavi","Açık Mavi","Gece Mavisi","Pembe","Turuncu","Kırmızı"];
const PAGE=48; let D=null, O=null, flat=[], shown=PAGE, lastKey="";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const enc=encodeURIComponent, ini=n=>n.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
const img=p=>p.startsWith("http")?p:D.base+p;
const hrefO=a=>"#/o"+a.map(x=>"/"+enc(x)).join("");
const oimg=(p,f)=>"https://raw.githubusercontent.com/ShogunTR/kaizen-otomobil-"+p.r+"/main/Otomobil/"+(p.d+"/"+f).split("/").map(encodeURIComponent).join("/");
const hrefB=b=>"#/m/"+enc(b), hrefM=(b,m)=>hrefB(b)+"/"+enc(m), hrefP=(b,m,i)=>hrefM(b,m)+"/"+i;

Promise.all([fetch("data.json").then(r=>r.json()),fetch("otomobil.json").then(r=>r.json()).catch(()=>null)]).then(([d,o])=>{
  D=d; O=o; if(O)(function w(n,path){(n.p||[]).forEach((p,i)=>flat.push({t:p.t,o:(p.o||"")+" "+path.join(" "),oh:hrefO(path)+"/~"+i,img:oimg(p,p.i[0]),sub:path.join(" › ")}));(n.c||[]).forEach(c=>w(c,path.concat(c.n)))})(O,[]); d.brands.forEach(b=>b.m.forEach(m=>m.p.forEach((p,i)=>flat.push({b:b.n,m:m.n,i,t:p.t,o:p.o||"",img:p.i[0]}))));
  route();
}).catch(()=>{$("#view").innerHTML='<div class="empty">Katalog yüklenemedi. Sayfayı yenile.</div>'});

function crumbs(list){
  $("#crumbs").innerHTML=list.map(([l,h],i)=>(i?"<span>›</span>":"")+(h&&i<list.length-1?`<a href="${h}">${esc(l)}</a>`:`<span>${esc(l)}</span>`)).join("");
}
function home(){
  crumbs([["Ana sayfa"]]);
  const n=D.brands.reduce((a,b)=>a+b.m.reduce((c,m)=>c+m.p.length,0),0);
  return `<h1>Aradığın trim parçası<br>burada.</h1>
  <p class="lead">Aracını seç, parçanın görsellerini gör, aradığın parça olduğundan emin ol. Parçalar sipariş üzerine basılır.</p>
  <div class="cats">
   <a class="cat" href="#/o"><span class="mono">${O?O.c.length+" marka · "+O.k+" parça":"Otomobil"}</span><span class="big">Otomobil</span></a>
   <a class="cat" href="#/m"><span class="mono">${D.brands.length} marka · ${n} parça</span><span class="big">Motosiklet</span></a>
  </div>`;
}
function brands(){
  crumbs([["Ana sayfa","#/"],["Motosiklet"]]);
  return `<h1>Motosiklet: marka seç</h1><p class="lead">Üretici markayı seç.</p>
  <div class="grid">${D.brands.map(b=>`<a class="tile" href="${hrefB(b.n)}"><span class="mark">${esc(ini(b.n))}</span><span class="name">${esc(b.n)}</span><span class="mono">${b.m.reduce((c,m)=>c+m.p.length,0)} parça</span></a>`).join("")}</div>`;
}
function models(bn){
  const b=D.brands.find(x=>x.n===bn); if(!b)return nf();
  crumbs([["Ana sayfa","#/"],["Motosiklet","#/m"],[bn]]);
  return `<h1>${esc(bn)}: model seç</h1><div class="grid">${b.m.map(m=>`<a class="tile" href="${hrefM(bn,m.n)}"><span class="name">${esc(m.n)}</span><span class="mono">${m.p.length} parça</span></a>`).join("")}</div>`;
}
function parts(bn,mn){
  const b=D.brands.find(x=>x.n===bn), m=b&&b.m.find(x=>x.n===mn); if(!m)return nf();
  crumbs([["Ana sayfa","#/"],["Motosiklet","#/m"],[bn,hrefB(bn)],[mn]]);
  const list=m.p.slice(0,shown);
  return `<h1>${esc(bn)} ${esc(mn)}</h1><p class="lead">${m.p.length} parça. Karta tıkla, görsellerden doğru parça olduğunu kontrol et.</p>
  <div class="grid parts">${list.map((p,i)=>card(p,hrefP(bn,mn,i),mn)).join("")}</div>
  ${m.p.length>shown?`<button class="btn more" id="more">Daha fazla göster (${m.p.length-shown})</button>`:""}`;
}
const card=(p,h,sub)=>`<a class="tile pt" href="${h}"><img loading="lazy" src="${img(p.img||p.i[0])}" alt="${esc(p.t)}"><span class="name">${esc(p.t)}</span><span class="mono">${esc(sub)}</span></a>`;
function part(bn,mn,idx){
  const b=D.brands.find(x=>x.n===bn), m=b&&b.m.find(x=>x.n===mn), p=m&&m.p[+idx]; if(!p)return nf();
  crumbs([["Ana sayfa","#/"],["Motosiklet","#/m"],[bn,hrefB(bn)],[mn,hrefM(bn,mn)],[p.t]]);
  return `<div class="detail">
  <div><div class="stage"><img id="big" src="${img(p.i[0])}" alt="${esc(p.t)}"></div>
   <div class="thumbs">${p.i.map((x,i)=>`<button data-src="${img(x)}" aria-pressed="${i===0}" aria-label="Görsel ${i+1}"><img loading="lazy" src="${img(x)}" alt=""></button>`).join("")}</div></div>
  <div><span class="chip">${esc(bn)} · ${esc(mn)}</span>
   <h1 style="margin-top:12px">${esc(p.t)}</h1>${p.v?`<p class="mono">Seçenek: ${esc(p.v)}</p>`:""}
   <div class="check"><b>Bu parça aradığın parça mı?</b><ul><li>Uyumlu model: <b>${esc(bn)} ${esc(mn)}</b></li><li>Görsellerdeki şekil elindeki parçayla aynı olmalı.</li><li>Emin değilsen parçanın fotoğrafını Instagram'dan gönder, birlikte bakalım.</li></ul></div>
   <h2>Renk seçenekleri</h2><div class="cols">${COLORS.map(c=>`<span>${c}</span>`).join("")}</div>
   <div class="cta"><a class="btn main" href="${SHOPIER}" target="_blank" rel="noopener">Shopier'den sipariş ver</a><a class="btn" href="${IG}" target="_blank" rel="noopener">Instagram'dan yaz</a></div>
   <p class="fine"><b>Güncel fiyat için bize sor.</b> Ürünler siparişe özel üretilir, cayma hakkı yoktur. Kargo ücretsiz. Siparişte renk tercihini ve motosiklet marka, model, yılını not olarak yaz.</p></div></div>`;
}
function search(q){
  crumbs([["Ana sayfa","#/"],["Arama"]]);
  const t=q.toLocaleLowerCase("tr"), words=t.split(/\s+/).filter(Boolean);
  const hit=flat.filter(f=>{const s=((f.b||"")+" "+(f.m||"")+" "+f.t+" "+f.o).toLocaleLowerCase("tr");return words.every(w=>s.includes(w))});
  return `<h1>"${esc(q)}"</h1><p class="lead">${hit.length} sonuç${hit.length>60?" (ilk 60 gösteriliyor)":""}</p>
  ${hit.length?`<div class="grid parts">${hit.slice(0,60).map(f=>card({t:f.t,i:[f.img]},f.oh||hrefP(f.b,f.m,f.i),f.sub||(f.b+" · "+f.m))).join("")}</div>`:'<div class="empty">Sonuç yok. Marka, model veya parça adı dene.</div>'}`;
}
function otoView(segs){
  if(!O){crumbs([["Ana sayfa","#/"],["Otomobil"]]);return '<p class="lead">Otomobil kataloğu yüklenemedi. Sayfayı yenile.</p>'}
  let pi=null; if(segs.length&&/^~\d+$/.test(segs[segs.length-1])){pi=+segs[segs.length-1].slice(1);segs=segs.slice(0,-1)}
  let n=O; for(const sg of segs){n=(n.c||[]).find(x=>x.n===sg); if(!n)return nf()}
  const cr=[["Ana sayfa","#/"],["Otomobil",segs.length||pi!==null?"#/o":null]];
  segs.forEach((x,i)=>cr.push([x,hrefO(segs.slice(0,i+1))]));
  if(pi!==null){
    const p=(n.p||[])[pi]; if(!p)return nf();
    cr.push([p.t]); crumbs(cr);
    const where=segs.join(" › ");
    return `<div class="detail">
    <div><div class="stage"><img id="big" src="${oimg(p,p.i[0])}" alt="${esc(p.t)}"></div>
     <div class="thumbs">${p.i.map((x,i)=>`<button data-src="${oimg(p,x)}" aria-pressed="${i===0}" aria-label="Görsel ${i+1}"><img loading="lazy" src="${oimg(p,x)}" alt=""></button>`).join("")}</div></div>
    <div><span class="chip">${esc(where)}</span>
     <h1 style="margin-top:12px">${esc(p.t)}</h1>
     <div class="check"><b>Bu parça aradığın parça mı?</b><ul><li>Uyumlu araç: <b>${esc(where)}</b></li><li>Görsellerdeki şekil elindeki parçayla aynı olmalı.</li><li>Emin değilsen parçanın fotoğrafını Instagram'dan gönder, birlikte bakalım.</li></ul></div>
     <h2>Renk seçenekleri</h2><div class="cols">${COLORS.map(c=>`<span>${c}</span>`).join("")}</div>
     <div class="cta"><a class="btn main" href="${SHOPIER}" target="_blank" rel="noopener">Shopier'den sipariş ver</a><a class="btn" href="${IG}" target="_blank" rel="noopener">Instagram'dan yaz</a></div>
     <p class="fine"><b>Güncel fiyat için bize sor.</b> Ürünler siparişe özel üretilir, cayma hakkı yoktur. Kargo ücretsiz. Siparişte renk tercihini ve araç marka, model, yılını not olarak yaz.</p></div></div>`;
  }
  crumbs(cr);
  const title=segs.length?segs.slice(-2).join(" "):"Otomobil: marka seç";
  let h=`<h1>${esc(title)}</h1><p class="lead">${segs.length?n.k+" parça":"Üretici markayı seç."}</p>`;
  if(n.c&&n.c.length)h+=`<div class="grid">${n.c.map(c=>`<a class="tile" href="${hrefO(segs.concat(c.n))}">${segs.length?"":`<span class="mark">${esc(ini(c.n))}</span>`}<span class="name">${esc(c.n)}</span><span class="mono">${c.k} parça</span></a>`).join("")}</div>`;
  if(n.p&&n.p.length){
    h+=`<h2 style="margin-top:28px">${n.c&&n.c.length?"Bu bölümdeki parçalar":"Parçalar"} (${n.p.length})</h2><div class="grid parts">${n.p.slice(0,shown).map((p,i)=>`<a class="tile pt" href="${hrefO(segs)}/~${i}"><img loading="lazy" src="${oimg(p,p.i[0])}" alt="${esc(p.t)}"><span class="name">${esc(p.t)}</span></a>`).join("")}</div>`;
    if(n.p.length>shown)h+=`<button class="btn more" id="more">Daha fazla göster (${n.p.length-shown})</button>`;
  }
  return h;
}
function nf(){crumbs([["Ana sayfa","#/"]]);return '<div class="empty">Sayfa bulunamadı.</div>'}
function route(keep){
  if(!D)return;
  const h=decodeURIComponent(location.hash.slice(1)||"/");
  const seg=location.hash.slice(1).split("/").slice(1).map(decodeURIComponent);
  const key=location.hash; if(key!==lastKey){shown=PAGE;lastKey=key}
  let html;
  if(seg[0]==="o")html=otoView(seg.slice(1));
  else if(!seg.length||seg[0]==="")html=home();
  else if(seg[0]==="m"){
    if(seg.length===1)html=brands();
    else if(seg.length===2)html=models(seg[1]);
    else if(seg.length===3)html=parts(seg[1],seg[2]);
    else html=part(seg[1],seg[2],seg[3]);
  } else html=nf();
  $("#view").innerHTML=html; if(!keep)window.scrollTo(0,0);
}
window.addEventListener("hashchange",()=>{$("#q").value="";route()});
document.addEventListener("click",e=>{
  if(e.target.closest("#more")){
    shown+=PAGE; const y=scrollY; route(true); scrollTo(0,y);
  }
  const t=e.target.closest(".thumbs button");
  if(t){$("#big").src=t.dataset.src;document.querySelectorAll(".thumbs button").forEach(b=>b.setAttribute("aria-pressed",b===t))}
});
$("#q").addEventListener("input",e=>{
  const q=e.target.value.trim();
  if(!D)return;
  if(q.length<2){if(location.hash.length<2||!/^#\/m/.test(location.hash)&&location.hash!=="#/")return;return}
  $("#view").innerHTML=search(q);
});
</script>
</body>
</html>
